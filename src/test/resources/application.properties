spring.application.name=order-logistics-agent-server-test
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false

integration.sspx.base-url=http://127.0.0.1:1
integration.sspx.oauth.client-id=test-client
integration.sspx.oauth.client-secret=test-secret
integration.cx.base-url=http://127.0.0.1:1
integration.cx.internal-token=test-internal-token
integration.order.base-url=http://127.0.0.1:1
integration.order.internal-token=test-order-internal-token

# 订单、物流工具默认关闭；测试按用例显式构造灰度策略。
agent.tool.order.enabled=false
agent.tool.order.rollout-mode=OFF
agent.tool.order.allowed-org-ids=
agent.tool.logistics.enabled=false
agent.tool.logistics.rollout-mode=OFF
agent.tool.logistics.allowed-org-ids=

# 结构化结果测试使用有界持久化配置，不连接真实数据库。
agent.chat.result.enabled=true
agent.chat.result.max-payload-bytes=1048576

# 聊天流测试配置；test application.properties 会覆盖 main 同名资源。
agent.chat.stream.timeout=30s
agent.chat.stream.heartbeat-interval=10s
agent.chat.stream.replay.enabled=true
agent.chat.stream.replay.key-prefix=agent:chat:stream:v1
agent.chat.stream.replay.ttl=2m
agent.chat.stream.replay.max-events=512
agent.chat.stream.replay.max-event-bytes=65536
agent.chat.stream.replay.max-stream-bytes=1048576
agent.chat.stream.replay.read-block-timeout=5s
agent.chat.stream.reconnect.max-attempts=5
agent.chat.stream.reconnect.initial-backoff=500ms
agent.chat.stream.reconnect.max-backoff=8s
agent.chat.stream.reconnect.jitter-ratio=0.2

agent.ai.prompt.version=test-v1
agent.ai.prompt.system=测试系统提示词
# 测试环境关闭 Nacos，因此在本地提供一套完整提示词目录以验证 Spring 接线。
# 生产环境不提供默认值，任一配置缺失仍会在启动阶段立即失败。
agent.ai.prompt.catalog.summary.system=测试摘要系统提示词
agent.ai.prompt.catalog.summary.user-template=版本：{promptVersion}\n目标：{targetOutputTokens}\n纠错：{formatCorrection}\n输入：{inputJson}
agent.ai.prompt.catalog.memory.explicit.system=测试显式记忆系统提示词
agent.ai.prompt.catalog.memory.explicit.user-template=版本：{promptVersion}\n消息：{sourceMessage}
agent.ai.prompt.catalog.memory.implicit.system=测试隐式记忆系统提示词
agent.ai.prompt.catalog.memory.implicit.user-template=版本：{promptVersion}\n上一条：{previousMessage}\n当前：{currentMessage}
agent.ai.prompt.catalog.memory.evidence.system=测试记忆证据核验系统提示词
agent.ai.prompt.catalog.memory.evidence.user-template={inputJson}
agent.ai.prompt.catalog.context.system-policy=测试用户记忆安全策略
agent.ai.prompt.catalog.context.summary.open-marker=[CONVERSATION_SUMMARY]
agent.ai.prompt.catalog.context.summary.close-marker=[/CONVERSATION_SUMMARY]
agent.ai.prompt.catalog.context.summary.header-template=主题：{topic}\n状态：{currentState}
agent.ai.prompt.catalog.context.summary.fact-heading=会话事实：
agent.ai.prompt.catalog.context.summary.decision-heading=已决定事项：
agent.ai.prompt.catalog.context.summary.open-question-heading=待解决问题：
agent.ai.prompt.catalog.context.summary.entity-heading=重要实体：
agent.ai.prompt.catalog.context.user-memory.open-marker=[UNTRUSTED_USER_MEMORY]
agent.ai.prompt.catalog.context.user-memory.close-marker=[/UNTRUSTED_USER_MEMORY]
agent.ai.prompt.catalog.context.user-memory.header=测试历史用户记忆提示
agent.ai.prompt.catalog.context.user-memory.entry-template=- 来源：{sourceType}；类别：{category}；内容：{content}
agent.ai.prompt.catalog.knowledge.evidence-header=测试知识库证据提示：
agent.ai.prompt.catalog.tools[search_products].description=测试商品查询工具
agent.ai.prompt.catalog.tools[search_products].parameters.keyword=测试商品关键词
agent.ai.prompt.catalog.tools[search_products].parameters.pageIndex=测试页码
agent.ai.prompt.catalog.tools[search_orders].description=测试订单查询工具
agent.ai.prompt.catalog.tools[search_orders].parameters.identifier=测试订单标识
agent.ai.prompt.catalog.tools[search_orders].parameters.identifierType=测试订单标识类型
agent.ai.prompt.catalog.tools[get_order_logistics].description=测试物流查询工具
agent.ai.prompt.catalog.tools[get_order_logistics].parameters.identifier=测试物流标识
agent.ai.prompt.catalog.tools[get_order_logistics].parameters.identifierType=测试物流标识类型
agent.ai.prompt.catalog.tools[search_customers].description=测试客户查询工具
agent.ai.prompt.catalog.tools[search_customers].parameters.keyword=测试客户关键词
agent.ai.prompt.catalog.tools[search_customers].parameters.matchType=测试客户匹配类型
agent.ai.prompt.catalog.tools[list_customer_orders].description=测试客户订单列表工具
agent.ai.prompt.catalog.tools[list_customer_orders].parameters.customerCode=测试客户编号
agent.ai.prompt.catalog.tools[search_after_sales].description=测试售后查询工具
agent.ai.prompt.catalog.tools[search_after_sales].parameters.identifierType=测试售后标识类型
agent.ai.prompt.catalog.tools[search_after_sales].parameters.identifier=测试售后标识
agent.ai.prompt.catalog.tools[search_after_sales].parameters.startTime=测试开始时间
agent.ai.prompt.catalog.tools[search_after_sales].parameters.endTime=测试结束时间
agent.ai.prompt.catalog.tools[get_after_sale_detail].description=测试售后详情工具
agent.ai.prompt.catalog.tools[get_after_sale_detail].parameters.afterSaleCode=测试售后工单号
agent.ai.prompt.catalog.tools[search_knowledge].description=测试知识查询工具
agent.ai.prompt.catalog.tools[search_knowledge].parameters.question=测试知识问题
agent.ai.model-capability.model=qwen-plus
agent.ai.model-capability.context-tokens=32768
agent.ai.model-capability.max-input-tokens=30720
agent.ai.model-capability.max-output-tokens=8192
agent.chat.context.max-input-tokens=8192
agent.chat.context.safety-margin-tokens=1024
agent.chat.context.tool-reserve-tokens=768
agent.chat.history.max-scan-messages=200
agent.chat.history.max-read-bytes=1048576

# 上下文测试只验证缓存组件接线，不访问真实 Redis。
agent.chat.history.cache.enabled=false
agent.chat.history.cache.key-prefix=agent:chat:history:v1
agent.chat.history.cache.ttl=30m
agent.chat.history.cache.ttl-jitter=0s
agent.chat.history.cache.warm-core-pool-size=1
agent.chat.history.cache.warm-max-pool-size=1
agent.chat.history.cache.warm-queue-capacity=10

# 长期摘要测试仅验证 Spring 接线；关闭调度业务，但提供完整配置以执行启动期校验。
agent.chat.summary.enabled=false
agent.chat.summary.shadow-mode=false
agent.chat.summary.context-enabled=false
agent.chat.summary.schema-version=1
agent.chat.summary.trigger-tokens=100
agent.chat.summary.trigger-turns=2
agent.chat.summary.retain-recent-turns=1
agent.chat.summary.raw-tail-max-tokens=100
agent.chat.summary.max-batch-messages=10
agent.chat.summary.max-batch-bytes=1000
agent.chat.summary.max-batch-tokens=500
agent.chat.summary.target-output-tokens=20
agent.chat.summary.max-output-tokens=30
agent.chat.summary.context-max-tokens=20
agent.chat.summary.prompt-version=summary-test-v1
agent.chat.summary.model=qwen-plus
agent.chat.summary.temperature=0.1
agent.chat.summary.timeout=10s
agent.chat.summary.worker.core-pool-size=1
agent.chat.summary.worker.max-pool-size=1
agent.chat.summary.worker.queue-capacity=10
agent.chat.summary.worker.claim-batch-size=2
agent.chat.summary.worker.poll-interval=5s
agent.chat.summary.worker.recovery-interval=60s
agent.chat.summary.worker.lease-duration=30s
agent.chat.summary.worker.instance-id=test-instance
agent.chat.summary.retry.max-attempts=3
agent.chat.summary.retry.initial-delay=1s
agent.chat.summary.retry.max-delay=10s
agent.chat.summary.retry.jitter=0s

agent.memory.enabled=false
agent.memory.auto-extract-default-enabled=true
agent.memory.context-max-tokens=256
agent.memory.max-content-length=512
agent.memory.max-evidence-length=512
agent.memory.page-size-max=50
agent.memory.explicit-expire-days=365
agent.memory.prompt-version=memory-explicit-semantic-test-v2
agent.memory.model=qwen-plus
agent.memory.temperature=0.1
agent.memory.timeout=10s
agent.memory.model-pool-size=1
agent.memory.model-queue-capacity=10
agent.memory.cursor.secret=test-memory-cursor-secret-32-bytes-long
agent.memory.auto-extract.confidence-threshold=0.85
agent.memory.auto-extract.expire-days=180
agent.memory.auto-extract.max-candidates=3
agent.memory.auto-extract.prompt-version=memory-semantic-test-v2
agent.memory.auto-extract.model=qwen-plus
agent.memory.auto-extract.temperature=0.0
agent.memory.auto-extract.timeout=10s
agent.memory.auto-extract.model-executor.pool-size=1
agent.memory.auto-extract.model-executor.queue-capacity=10
agent.memory.auto-extract.worker.poll-interval=5s
agent.memory.auto-extract.worker.recovery-interval=60s
agent.memory.auto-extract.worker.claim-batch-size=2
agent.memory.auto-extract.worker.lease-duration=30s
agent.memory.auto-extract.worker.max-attempts=3
agent.memory.auto-extract.worker.initial-backoff=1s
agent.memory.auto-extract.worker.max-backoff=10s
agent.memory.auto-extract.worker.executor.pool-size=1
agent.memory.auto-extract.worker.executor.queue-capacity=10
agent.memory.auto-extract.expiry.poll-interval=10m
agent.memory.auto-extract.expiry.batch-size=100
agent.memory.index-worker.poll-interval=5s
agent.memory.index-worker.recovery-interval=60s
agent.memory.index-worker.claim-batch-size=2
agent.memory.index-worker.lease-duration=30s
agent.memory.index-worker.max-attempts=3
agent.memory.index-worker.initial-backoff=1s
agent.memory.index-worker.max-backoff=10s
agent.memory.index-worker.executor.pool-size=1
agent.memory.index-worker.executor.queue-capacity=10
agent.memory.retrieval.max-candidates=20
agent.memory.retrieval.max-selected=5
agent.memory.retrieval.global-explicit-limit=3

spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://127.0.0.1:1
spring.ai.openai.chat.options.model=qwen-plus
spring.ai.openai.chat.options.max-tokens=512
# Semantic explicit-memory admission
agent.memory.semantic.confidence-threshold=0.85
