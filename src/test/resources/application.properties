spring.application.name=order-logistics-agent-server-test
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false

integration.sspx.base-url=http://127.0.0.1:1
integration.sspx.oauth.client-id=test-client
integration.sspx.oauth.client-secret=test-secret
integration.cx.base-url=http://127.0.0.1:1
integration.cx.internal-token=test-internal-token

agent.ai.prompt.version=test-v1
agent.ai.prompt.system=测试系统提示词
agent.ai.model-capability.model=qwen-plus
agent.ai.model-capability.context-tokens=32768
agent.ai.model-capability.max-input-tokens=30720
agent.ai.model-capability.max-output-tokens=8192
agent.chat.context.max-input-tokens=8192
agent.chat.context.safety-margin-tokens=1024
agent.chat.context.tool-reserve-tokens=768
agent.chat.history.max-scan-messages=200
agent.chat.history.max-read-bytes=1048576

# 上下文测试只验证缓存组件接线，不访问真实 Redis。
agent.chat.history.cache.enabled=false
agent.chat.history.cache.key-prefix=agent:chat:history:v1
agent.chat.history.cache.ttl=30m
agent.chat.history.cache.ttl-jitter=0s
agent.chat.history.cache.warm-core-pool-size=1
agent.chat.history.cache.warm-max-pool-size=1
agent.chat.history.cache.warm-queue-capacity=10

# 长期摘要测试仅验证 Spring 接线；关闭调度业务，但提供完整配置以执行启动期校验。
agent.chat.summary.enabled=false
agent.chat.summary.shadow-mode=false
agent.chat.summary.context-enabled=false
agent.chat.summary.schema-version=1
agent.chat.summary.trigger-tokens=100
agent.chat.summary.trigger-turns=2
agent.chat.summary.retain-recent-turns=1
agent.chat.summary.raw-tail-max-tokens=100
agent.chat.summary.max-batch-messages=10
agent.chat.summary.max-batch-bytes=1000
agent.chat.summary.max-batch-tokens=500
agent.chat.summary.target-output-tokens=20
agent.chat.summary.max-output-tokens=30
agent.chat.summary.context-max-tokens=20
agent.chat.summary.prompt-version=summary-test-v1
agent.chat.summary.model=qwen-plus
agent.chat.summary.temperature=0.1
agent.chat.summary.timeout=10s
agent.chat.summary.worker.core-pool-size=1
agent.chat.summary.worker.max-pool-size=1
agent.chat.summary.worker.queue-capacity=10
agent.chat.summary.worker.claim-batch-size=2
agent.chat.summary.worker.poll-interval=5s
agent.chat.summary.worker.recovery-interval=60s
agent.chat.summary.worker.lease-duration=30s
agent.chat.summary.worker.instance-id=test-instance
agent.chat.summary.retry.max-attempts=3
agent.chat.summary.retry.initial-delay=1s
agent.chat.summary.retry.max-delay=10s
agent.chat.summary.retry.jitter=0s

spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://127.0.0.1:1
spring.ai.openai.chat.options.model=qwen-plus
spring.ai.openai.chat.options.max-tokens=512
