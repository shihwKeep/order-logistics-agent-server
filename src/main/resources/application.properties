spring.application.name=order-logistics-agent-server

spring.config.import=nacos:order-logistics-agent-server.properties?group=ORDER_LOGISTICS_AGENT&refreshEnabled=false

spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:order-logistics-agent-dev}
spring.cloud.nacos.username=${NACOS_USERNAME}
spring.cloud.nacos.password=${NACOS_PASSWORD}

# OAuth values are supplied by the local/production runtime, never committed.
integration.sspx.oauth.client-id=${SSPX_OAUTH_CLIENT_ID}
integration.sspx.oauth.client-secret=${SSPX_OAUTH_CLIENT_SECRET}

# Redis 会话历史快照缓存。MySQL 始终是权威数据源，缓存异常时自动回源。
agent.chat.history.cache.enabled=${AGENT_CHAT_HISTORY_CACHE_ENABLED:true}
agent.chat.history.cache.key-prefix=agent:chat:history:v1
agent.chat.history.cache.ttl=30m
agent.chat.history.cache.ttl-jitter=5m

# 会话结束后的异步缓存预热线程池，使用有界队列防止故障时无限堆积。
agent.chat.history.cache.warm-core-pool-size=1
agent.chat.history.cache.warm-max-pool-size=2
agent.chat.history.cache.warm-queue-capacity=100
