spring.application.name=order-logistics-agent-server

spring.config.import=nacos:order-logistics-agent-server.properties?group=ORDER_LOGISTICS_AGENT&refreshEnabled=false

spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:order-logistics-agent-dev}
spring.cloud.nacos.username=${NACOS_USERNAME}
spring.cloud.nacos.password=${NACOS_PASSWORD}

# Cross-conversation memory is fail-safe disabled until explicitly enabled in Nacos.
agent.memory.enabled=false
agent.memory.auto-extract-default-enabled=true
agent.memory.context-max-tokens=256
agent.memory.max-content-length=512
agent.memory.max-evidence-length=512
agent.memory.page-size-max=50
agent.memory.explicit-expire-days=365
agent.memory.prompt-version=memory-explicit-v1
agent.memory.model=qwen-plus
agent.memory.temperature=0.1
agent.memory.timeout=10s
agent.memory.model-pool-size=2
agent.memory.model-queue-capacity=100
