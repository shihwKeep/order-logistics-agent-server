spring.application.name=order-logistics-agent-server

spring.config.import=nacos:order-logistics-agent-server.properties?group=ORDER_LOGISTICS_AGENT&refreshEnabled=false

spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:order-logistics-agent-dev}
spring.cloud.nacos.username=${NACOS_USERNAME}
spring.cloud.nacos.password=${NACOS_PASSWORD}

# Chat SSE total lifetime and server-to-client idle keepalive.
agent.chat.stream.timeout=30s
agent.chat.stream.heartbeat-interval=10s
agent.chat.stream.replay.enabled=true
agent.chat.stream.replay.key-prefix=agent:chat:stream:v1
agent.chat.stream.replay.ttl=2m
agent.chat.stream.replay.max-events=512
agent.chat.stream.replay.max-event-bytes=65536
agent.chat.stream.replay.max-stream-bytes=1048576
agent.chat.stream.replay.read-block-timeout=5s
agent.chat.stream.reconnect.max-attempts=5
agent.chat.stream.reconnect.initial-backoff=500ms
agent.chat.stream.reconnect.max-backoff=8s
agent.chat.stream.reconnect.jitter-ratio=0.2
agent.chat.stream.model-retry.max-attempts=3
agent.chat.stream.model-retry.initial-backoff=500ms
agent.chat.stream.model-retry.max-backoff=2s
agent.chat.stream.model-retry.jitter-ratio=0.2

# Cross-conversation memory is fail-safe disabled until explicitly enabled in Nacos.
agent.memory.enabled=false
agent.memory.auto-extract-default-enabled=true
agent.memory.context-max-tokens=256
agent.memory.max-content-length=512
agent.memory.max-evidence-length=512
agent.memory.page-size-max=50
agent.memory.explicit-expire-days=365
agent.memory.prompt-version=memory-explicit-semantic-v2
agent.memory.model=qwen-plus
agent.memory.temperature=0.1
agent.memory.timeout=10s
agent.memory.model-pool-size=2
agent.memory.model-queue-capacity=100
agent.memory.cursor.secret=${MEMORY_CURSOR_SECRET}
agent.memory.auto-extract.confidence-threshold=0.85
agent.memory.auto-extract.expire-days=180
agent.memory.auto-extract.max-candidates=3
agent.memory.auto-extract.prompt-version=memory-semantic-v2
agent.memory.auto-extract.model=qwen-plus
agent.memory.auto-extract.temperature=0.0
agent.memory.auto-extract.timeout=10s
agent.memory.auto-extract.model-executor.pool-size=2
agent.memory.auto-extract.model-executor.queue-capacity=100
agent.memory.auto-extract.worker.poll-interval=2s
agent.memory.auto-extract.worker.recovery-interval=30s
agent.memory.auto-extract.worker.claim-batch-size=10
agent.memory.auto-extract.worker.lease-duration=60s
agent.memory.auto-extract.worker.max-attempts=5
agent.memory.auto-extract.worker.initial-backoff=2s
agent.memory.auto-extract.worker.max-backoff=5m
agent.memory.auto-extract.worker.executor.pool-size=2
agent.memory.auto-extract.worker.executor.queue-capacity=100
agent.memory.auto-extract.expiry.poll-interval=10m
agent.memory.auto-extract.expiry.batch-size=100
agent.memory.index-worker.poll-interval=2s
agent.memory.index-worker.recovery-interval=30s
agent.memory.index-worker.claim-batch-size=10
agent.memory.index-worker.lease-duration=60s
agent.memory.index-worker.max-attempts=8
agent.memory.index-worker.initial-backoff=2s
agent.memory.index-worker.max-backoff=5m
agent.memory.index-worker.executor.pool-size=2
agent.memory.index-worker.executor.queue-capacity=100
agent.memory.maintenance.reindex-on-startup=false
agent.memory.maintenance.reindex-confirmation=
agent.memory.maintenance.batch-size=500
agent.memory.retrieval.max-candidates=20
agent.memory.retrieval.max-selected=5
agent.memory.retrieval.global-explicit-limit=3
# Semantic explicit-memory admission
agent.memory.semantic.confidence-threshold=0.85

# 生产可观测性：指标由Prometheus抓取，Trace异步发送到OpenTelemetry Collector。
management.endpoints.web.exposure.include=health,info,prometheus
# 独立管理端口只供 Collector 和运维网络访问，业务 API 仍监听 server.port。
management.server.port=${MANAGEMENT_SERVER_PORT:18082}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${DEPLOYMENT_ENVIRONMENT:local}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.otlp.tracing.connect-timeout=2s
management.otlp.tracing.timeout=5s
management.observations.annotations.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
# Agent 自定义 Timer 默认只导出 count/sum/max；开启直方图后才能由 Grafana 计算真实 P95。
management.metrics.distribution.percentiles-histogram.agent.turn.duration=true
management.metrics.distribution.percentiles-histogram.agent.model.first.delta=true
management.metrics.distribution.percentiles-histogram.agent.tool.call.duration=true
