route:
  receiver: local-default
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="P1"
      receiver: wecom

receivers:
  - name: local-default
  - name: wecom
    webhook_configs:
      - url: http://alert-webhook-adapter:8095/webhook/alertmanager
        send_resolved: true
