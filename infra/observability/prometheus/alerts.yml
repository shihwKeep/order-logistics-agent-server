groups:
  - name: observability-foundation
    rules:
      - alert: TelemetryCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: OpenTelemetry Collector不可用
          runbook: docs/runbook/observability-stack.md

      - alert: ServiceHighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (application)
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])) by (application), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "{{ $labels.application }} 5xx比例连续5分钟超过5%"
          runbook: docs/runbook/observability-stack.md

      - alert: TelemetryExporterDrops
        expr: rate(otelcol_exporter_send_failed_spans[5m]) > 0
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: Collector持续丢弃Trace
          runbook: docs/runbook/observability-stack.md

      - alert: AgentTurnHighFailureRate
        expr: |
          sum(rate(agent_turn_completed_total{outcome=~"FAILED|TIMEOUT|OUTPUT_ERROR"}[5m]))
          /
          clamp_min(sum(rate(agent_turn_completed_total[5m])), 0.001) > 0.10
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: Agent问答失败率连续5分钟超过10%
          runbook: docs/runbook/observability-stack.md

      - alert: DownstreamCallFailureRateHigh
        expr: |
          sum(rate(agent_downstream_call_duration_count{outcome!="SUCCESS"}[5m])) by (service, operation)
          /
          clamp_min(sum(rate(agent_downstream_call_duration_count[5m])) by (service, operation), 0.001) > 0.20
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "下游{{ $labels.service }}/{{ $labels.operation }}失败率超过20%"
          runbook: docs/runbook/observability-stack.md

      - alert: SseResumeFailureRateHigh
        expr: |
          sum(rate(agent_chat_stream_resume_attempt_total{result="failure"}[5m]))
          /
          clamp_min(sum(rate(agent_chat_stream_resume_attempt_total[5m])), 0.001) > 0.10
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: SSE断点恢复失败率连续5分钟超过10%
          runbook: docs/runbook/observability-stack.md

      - alert: SseRedisReplayFailure
        expr: sum(rate(agent_chat_stream_replay_failure_total{reason="redis"}[5m])) > 0.1
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: SSE Redis回放持续失败
          runbook: docs/runbook/observability-stack.md

      - alert: AgentModelStreamRetryExhausted
        expr: sum(rate(agent_model_stream_retry_total{outcome="EXHAUSTED"}[5m])) > 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: 模型流重试耗尽，Agent无法完成回答
          runbook: docs/runbook/observability-stack.md

      - alert: KnowledgeCitationGateRejected
        expr: |
          sum(rate(agent_tool_result_total{kind="knowledge-citations",outcome="GATE_REJECTED"}[5m]))
          /
          clamp_min(sum(rate(agent_tool_result_total{kind="knowledge-citations"}[5m])), 0.001) > 0.20
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: 知识库证据门禁拒绝率连续5分钟超过20%
          runbook: docs/runbook/knowledge-tool-verification.md

      - alert: AlertWebhookAdapterDown
        expr: up{exported_job="alert-webhook-adapter"} == 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: 企微告警适配服务不可用，外部通知链路已中断
          runbook: docs/runbook/observability-stack.md

      - alert: AlertWebhookDeliveryFailed
        expr: sum(rate(alert_webhook_delivery_total{outcome="FAILED"}[5m])) > 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: 企微告警经过有限重试后仍投递失败
          runbook: docs/runbook/observability-stack.md

  - name: composite-query-v2
    rules:
      - alert: CompositeGraphFailureRateHigh
        expr: |
          (
            sum(rate(agent_composite_graph_total{outcome=~"FAILED|UNAVAILABLE"}[5m]))
            /
            clamp_min(sum(rate(agent_composite_graph_total[5m])), 0.001) > 0.10
          )
          and
          sum(increase(agent_composite_graph_total[5m])) >= 5
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: Composite V2图失败率连续5分钟超过10%
          runbook: docs/runbook/composite-query-observability.md

      - alert: CompositePartialSuccessRateHigh
        expr: |
          (
            sum(rate(agent_composite_graph_total{outcome="PARTIAL_SUCCESS"}[5m]))
            /
            clamp_min(sum(rate(agent_composite_graph_total[5m])), 0.001) > 0.20
          )
          and
          sum(increase(agent_composite_graph_total[5m])) >= 5
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: Composite V2部分成功比例连续5分钟超过20%
          runbook: docs/runbook/composite-query-observability.md

      - alert: CompositeCheckpointOperationError
        expr: sum(rate(agent_composite_checkpoint_total{outcome=~"ERROR|UNAVAILABLE"}[5m])) > 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: Composite V2 checkpoint持久化持续异常
          runbook: docs/runbook/composite-query-observability.md

      - alert: CompositeCheckpointResumeFailed
        expr: sum(rate(agent_composite_checkpoint_resume_total{outcome="FAILED"}[5m])) > 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: Composite V2 checkpoint恢复持续失败
          runbook: docs/runbook/composite-query-observability.md

      - alert: CompositeNodeRetryExhausted
        expr: sum(rate(agent_composite_retry_total{outcome="EXHAUSTED"}[5m])) > 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: Composite V2节点重试持续耗尽
          runbook: docs/runbook/composite-query-observability.md

      - alert: CompositeDependencyFailureRateHigh
        expr: |
          (
            sum(rate(agent_composite_dependency_total{outcome="FAILED"}[5m]))
            /
            clamp_min(sum(rate(agent_composite_dependency_total[5m])), 0.001) > 0.20
          )
          and
          sum(increase(agent_composite_dependency_total[5m])) >= 5
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: Composite V2依赖解析失败率连续5分钟超过20%
          runbook: docs/runbook/composite-query-observability.md
